<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- calendar binding rings -->
  <rect x="376" y="228" width="36" height="130" rx="18" fill="#c7d2fe"/>
  <rect x="612" y="228" width="36" height="130" rx="18" fill="#c7d2fe"/>

  <!-- calendar body -->
  <rect x="228" y="304" width="568" height="464" rx="48" fill="#ffffff"/>
  <!-- calendar header band -->
  <path d="M228 352 a48 48 0 0 1 48 -48 h472 a48 48 0 0 1 48 48 v64 h-568 z" fill="#e0e7ff"/>

  <!-- date dots -->
  <g fill="#6366f1">
    <circle cx="336" cy="516" r="24"/><circle cx="452" cy="516" r="24"/><circle cx="568" cy="516" r="24"/>
    <circle cx="336" cy="632" r="24"/><circle cx="452" cy="632" r="24"/>
  </g>

  <!-- send badge -->
  <circle cx="744" cy="744" r="180" fill="#ffffff"/>
  <path d="M660 676 L838 744 L660 812 L662 764 L772 744 L662 724 Z" fill="url(#plane)"/>
</svg>
